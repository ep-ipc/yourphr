######################################################################
# Version
#
# version specifies the version of this configuration file schema, not
# the fasten binary. There is only 1 version available at the moment
version: 1

web:
  # Deployment label shown in the UI footer as "<name>-<semver>" (e.g. demo-1.18.2 / prod-1.18.2).
  # Same release image ships to every instance — set this per env so demo is not labeled "prod".
  # Env: YOURPHR_WEB_ENVIRONMENT_NAME (e.g. demo, prod, dev). Empty → frontend build-time default.
  environment_name: ''
  listen:
    port: 8080
    host: 0.0.0.0
# Optional process metrics for completed SMART/background sync jobs (#441).
# OFF by default. When enabled, binds an INTERNAL-ONLY scrape port (Prometheus text /metrics).
# Do not put this on a public Ingress — same posture as the OAuth relay METRICS_PORT.
# Env: YOURPHR_METRICS_ENABLED, YOURPHR_METRICS_PORT or YOURPHR_METRICS_ADDR (e.g. ":9091").
metrics:
  enabled: false
  # port: 9091          # used when addr is empty → listen on ":<port>"
  # addr: '127.0.0.1:9091'  # optional full bind address (overrides port)
    # if you're using a reverse proxy like apache/nginx, you can override this value to serve fasten on a subpath.
    # eg. http://example.com/fasten/* vs http://example.com:8080
    # basepath: `/fasten`
    # leave empty unless behind a path prefixed proxy
    basepath: ''
    
    https:
      enabled: true
      certDir: "certs"
      sharedDir: "certs/shared"
  src:
    # the location on the filesystem where webapp javascript + css is located
    frontend:
      path: /opt/fasten/web
database:
  encryption:
    enabled: true
  #    key: ''
  type: 'sqlite' # postgres will be supported in the future, but is completely **BROKEN** at the moment.
  location: '/opt/fasten/db/fasten.db' # if postgres (**BROKEN**) use a DSN, eg. `host=localhost user=gorm password=gorm dbname=gorm port=9920 sslmode=required TimeZone=Asia/Shanghai`
# Admin Database backups (#361). `label` is an optional instance tag stamped into backup filenames,
# e.g. label "prod" -> 2026-06-21T14-09-57Z-yourphr-prod-1.9.0-backup.db.gz (omitted when blank). Set
# it per instance to tell backups apart (config.dev.yaml uses "dev"; on the deploy set
# YOURPHR_BACKUP_LABEL=prod). The schedule (enable/time/days/destination/retention) is managed from the
# Admin Database card and persisted in the data dir, not here.
#
# Destination allowlist (#383 / #434): backups may only be written under:
#   - the data volume (database.location's parent) — always allowed
#   - backup.destination (if set here)
#   - each path in backup.allowed-roots
#   - a destination already saved via the Admin UI (.backup_settings.json)
# For a NAS/external mount first time, list it in allowed-roots (or set destination) in config —
# otherwise ValidateBackupDestination rejects the path and the scheduler fails silently until
# health status is checked on Admin → Database. Health is also on the Admin Dashboard badge.
backup:
  label: '' # e.g. 'prod' / 'sandbox'; blank = no label segment
  # destination: '/mnt/nas/yourphr-backups'   # optional static default; also becomes an allowlist root
  # allowed-roots:                            # extra bases for Admin UI / schedule destinations
  #   - '/mnt/nas'
  #   - '/var/backups/yourphr'
# Instance operator contact (shown to users of this deployment; editable on Admin Dashboard).
# Env: YOURPHR_OPERATOR_NAME, YOURPHR_OPERATOR_CONTACT_EMAIL, YOURPHR_OPERATOR_CONTACT_URL.
# Values saved in the Admin UI win over these defaults (persisted next to the DB).
operator:
  name: ''           # e.g. 'Nerds by the Hour'
  contact_email: ''  # support address for wipe / privacy questions about this instance
  contact_url: ''    # optional https help or privacy page
log:
  # Logs always go to STDOUT/STDERR; when this is set they are ALSO tee'd to this file so the
  # Admin Dashboard "Server Logs" card can read them back. Defaults to the persistent DB volume
  # so it survives restarts (`kubectl logs`/`docker logs` keep working regardless). Set to '' to
  # disable file logging (STDOUT only). For local dev, override this in config.dev.yaml.
  file: '/opt/fasten/db/fasten.log' # absolute or relative paths allowed, eg. web.log
  level: INFO
# C-CDA / CCD document import (#254). Opt-in: requires the external fhir-converter
# sidecar (Metriport). Leave disabled for a stock install — FHIR/NDJSON upload is
# unaffected. When enabled, raw .xml/.ccd uploads are converted to FHIR R4 before import.
# C-CDA / CCD (XML) import (#254, #404). ON by default: XML is what patient portals actually export
# (Epic MyChart and friends), so importing your own records should not require extra setup.
# Conversion runs on a sidecar container that the shipped docker-compose files start automatically.
#
# If you run the app WITHOUT that sidecar (e.g. a bare k8s Deployment), either deploy it — see
# deploy/yourphr-cda-converter.example.yaml — and point `url` at it, or set enabled: false
# (YOURPHR_CDA_CONVERTER_ENABLED=false). Uploading XML with no reachable converter fails with an
# error naming exactly what to fix; nothing else is affected.
#
# The converter is INTERNAL-ONLY: raw C-CDA is PHI, so never expose it on a public port.
cda_converter:
  enabled: true
  url: 'http://cda-converter:8080' # the compose service name; k8s: http://yourphr-cda-converter:8080
  timeout_seconds: 60
jwt:
  issuer:
    # This is a KNOWN PUBLIC default and is treated as "unset" (see #102): the
    # server never signs with it. On first run it auto-generates a strong random
    # key and persists it 0600 at <db-dir>/.jwt_issuer_key (secure-by-default,
    # zero-config). To pin your own instead, set a non-default value here or via
    # the YOURPHR_JWT_ISSUER_KEY env var (generate one with: openssl rand -hex 32).
    key: "thisismysupersecuressessionsecretlength"

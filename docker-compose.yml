version: "3.9"
services:
  fasten:
    # NOTE: only developers need to build Fasten from source
    # For production, use the pre-built image from GitHub Packages
    # ghcr.io/jwilleke/yourphr:main
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - YOURPHR_ENV=prod
#        - YOURPHR_ENV=sandbox
    hostname: ${HOSTNAME:-fasten}
    # Pass YOURPHR_* app config from .env / .env_custom INTO the container (#397).
    #
    # Compose reads .env only for ${...} substitution in THIS file — it does not forward those
    # values to the container. Without env_file, a setting like YOURPHR_CDA_CONVERTER_ENABLED=true
    # in .env is silently ignored: the app never sees it, and nothing warns. (The backend also
    # loads .env/.env_custom itself, but from its WORKDIR *inside* the container — /opt/fasten —
    # which is not where the host file lives.)
    #
    # .env_custom is for gitignored per-deployment overrides; both are optional.
    env_file:
      - path: .env
        required: false
      - path: .env_custom
        required: false
    environment:
      - HOST_IP=${IP}
      - HOST_PORT=${PORT}
    ports:
      - "${PORT:-9090}:8080"
    # ./data is where the image actually writes (YOURPHR_FAST_STORAGE=/opt/yourphr/data, and a
    # VOLUME in the Dockerfile). This mounted ./db:/opt/fasten/db for the Go layout, which nothing
    # writes to any more — so both databases, the accounts and the imported records were landing in
    # an anonymous volume that `docker compose down -v` or a prune silently takes away.
    volumes:
      - ./data:/opt/yourphr/data
      - ./certs:/opt/fasten/certs/shared

  # C-CDA/CCD converter sidecar (#254). Started by DEFAULT (#404): C-CDA XML is what patient portals
  # (Epic MyChart and friends) actually export, so requiring a second container plus two env vars to
  # import your own records was the largest remaining setup barrier. the shipped default points the app here
  # out of the box — a stock `docker compose up` imports an Epic export with no further steps.
  #
  # Image built by .github/workflows/docker-cda-converter.yaml (repackages Metriport's AGPL-3.0
  # fhir-converter at a pinned ref; running it as a separate process keeps it an independent work).
  #
  # INTERNAL ONLY — `expose`, never `ports`. Raw C-CDA is PHI; this must not be reachable from
  # outside the compose network. `fasten` reaches it at http://cda-converter:8080.
  #
  # Don't want it? `docker compose up --scale cda-converter=0`, or set
  # YOURPHR_CDA_CONVERTER_ENABLED=false. The service is stateless and stores nothing.
  cda-converter:
    image: ghcr.io/jwilleke/yourphr-cda-converter:main
    restart: unless-stopped
    expose:
      - "8080"


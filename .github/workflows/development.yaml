name: Development

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    # Docs-only PRs don't need the Go/Angular test suite. (A mixed code+docs PR still runs.)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_call:

# Least-privilege default for every job: checkout + test + artifact upload only
# (artifact upload uses its own token), so no write scopes are required. Also
# caps the permissions when called as a reusable workflow from ci.yaml.
permissions:
  contents: read

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Test Frontend
        run: |
          make test-frontend-coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ${{ github.workspace }}/frontend/coverage/fastenhealth/lcov.info
          retention-days: 1
  audit-frontend-deps:
    name: Audit Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # Dependabot cannot see a dependency resolved from a git URL — it has no registry coordinates
      # to match an advisory against — so the alerts page read "0 open" while a CRITICAL sat in the
      # shipped bundle for months (#530, #533). yarn audit reads the lockfile directly and found it.
      # No install needed: audit works from yarn.lock alone.
      - name: Report every advisory (never fails the build)
        working-directory: frontend
        run: yarn audit --groups dependencies || true
      # Gate ONLY on critical production findings. The tree carries ~23 high advisories in build
      # tooling — eslint, storybook, karma, the Angular devkit — which never reach a browser, and a
      # job that is permanently red teaches everyone to ignore it, which is worse than no job.
      #
      # Yarn Classic's audit exit code is a BITMASK of the severities it reported, not pass/fail:
      # 1 INFO, 2 LOW, 4 MODERATE, 8 HIGH, 16 CRITICAL. Verified on this tree: a single LOW
      # advisory exits 2, not 1. So test bit 16 rather than relying on a non-zero exit, which today
      # would fail every run on that one low finding.
      #
      # NOTE `--level` is deliberately absent: on Yarn Classic it does NOT filter — passing
      # `--level critical` still reports and still counts lows — so including it would suggest a
      # filter that is not happening.
      - name: Fail on critical production advisories
        working-directory: frontend
        run: |
          set +e
          yarn audit --groups dependencies > audit.txt 2>&1
          code=$?
          set -e
          echo "yarn audit exit bitmask: $code"
          tail -5 audit.txt
          if [ $(( code & 16 )) -ne 0 ]; then
            echo "::error::critical advisory in a production dependency — see the report above"
            exit 1
          fi
          echo "no critical production advisories"
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    container: ghcr.io/packagrio/packagr:latest-golang
    env:
      STATIC: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Cache the Go module cache + build cache across runs. This also caches the Go 1.25/1.26
      # toolchain that GOTOOLCHAIN auto-downloads (it lives under the module cache), so each run
      # stops re-fetching it and recompiling deps from cold. Key invalidates on go.sum changes.
      - name: Cache Go modules + build
        uses: actions/cache@v6
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Setup
        run: |
          go install github.com/golang/mock/mockgen@v1.6.0
          go generate ./...
      - name: Test Backend
        run: |
          make test-backend-coverage
          CGO_ENABLED=0 go build -buildvcs=false ./backend/cmd/fasten/
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ${{ github.workspace }}/backend-coverage.txt
          retention-days: 1
  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # Cache the Go module + build cache so the webServer's `go run` of the backend is fast.
      - name: Cache Go modules + build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-e2e-
            ${{ runner.os }}-go-
      - name: Install frontend deps
        run: make dep-frontend
      # Browser binaries + OS libs (chromium + firefox for the multi-browser CSP matrix, #131).
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium firefox
      # Builds the frontend, then Playwright boots the Go backend (config.e2e.yaml, fresh
      # ./db/fasten-e2e.db, :9191) serving dist under /web and runs the smoke suite.
      - name: Run E2E
        run: make test-e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  compile-storybook:
    name: Compile Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: |
          make build-storybook

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: ng lint (angular-eslint)
        run: |
          make lint-frontend

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Canonical exclusion set — keep identical to markdown-lint.yml. Skip vendored/3rd-party
          # and gitignored build artifacts (vendor/, dist/), legal text (LICENSE.md), and the
          # machine-generated CHANGELOG (release-please regenerates it each release; its format
          # trips MD012 and we don't hand-edit it).
          globs: |
            **/*.md
            !**/node_modules/**
            !vendor/**
            !**/dist/**
            !**/test-results/**
            !**/storybook-static/**
            !LICENSE.md
            !CHANGELOG.md

name: Docker (release)
# Publishes ghcr.io/jwilleke/yourphr-ts-spike on a release tag (vX.Y.Z) => :X.Y.Z / :X.Y / :latest —
# the same release-gated contract as the product image (yourphr docs/deployment/deployment-contract.md):
# pushes to main are CI-tested and build NO image; the live instance moves only when a tag is cut.
# Flux's ImagePolicy (mj-infra-flux apps/production/image-automation/yourphr-ts-policy.yaml) filters
# semver tags, so :latest and any branch tag are invisible to it.
#
# MULTI-ARCH from one runner: see the Dockerfile — TypeScript compiles on the build platform and
# the one native module ships prebuilds for both arches, so nothing compiles under QEMU.

on:
  push:
    tags: ['v*.*.*']
  # Manual re-publish of an existing tag (base-image refresh, frontend pin bump) — run from the tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Dispatched from a branch, every tag pattern below is empty and build-push-action fails on an
    # empty tag list. Skip cleanly instead.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=YourPHR (TypeScript stack)
            org.opencontainers.image.description=YourPHR — your medical records, immediately and in your hands, for free. The TypeScript stack that succeeds the Go backend.
            org.opencontainers.image.source=https://github.com/jwilleke/yourphr-ts-spike
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed manifest is multi-arch
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt

name: Markdown Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: the lint job only reads the checked-out repo.
permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        # No `globs:` here, deliberately (yourphr#561) — `.markdownlint-cli2.jsonc` carries both the
        # rules and the file set, so CI, `npm run lint:md` and the editor give the same answer.
        # An inline list here overrides that file and is how the three copies drifted apart before.
        uses: DavidAnson/markdownlint-cli2-action@v24

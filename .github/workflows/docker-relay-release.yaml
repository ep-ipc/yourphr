name: Docker (YourPHR relay — release)
# Publishes SEMVER-tagged relay images on a release tag (vX.Y.Z) => :X.Y.Z / :X.Y / :latest,
# so update-tracking tools (What's Up Docker, Renovate, Flux ImagePolicy) can follow the relay
# the same way they follow the main app image (issue #450).
#
# WHY A SEPARATE FILE from docker-relay.yaml. That workflow builds dev images on pushes to main
# and uses a `paths:` filter so the tiny relay only rebuilds when its own sources change. A
# release tag commit (`chore(release): vX.Y.Z`) touches only version/CHANGELOG files, which do
# NOT match those paths — and GitHub does not document whether `paths:` is even evaluated for tag
# pushes. Rather than depend on undocumented filter interaction, release builds get their own
# trigger with no path filter. Same Dockerfile, same registry, disjoint tag sets.
#
# MULTI-ARCH (#405): linux/amd64 + linux/arm64 from a single amd64 runner, no QEMU and no matrix —
# Dockerfile.relay cross-compiles (CGO_ENABLED=0, $BUILDPLATFORM builder, GOOS/GOARCH retarget) and
# its final stage is COPY-only.

on:
  push:
    tags: ['v*.*.*']
  # Manual re-publish of an existing tag (e.g. base-image refresh) — run from the tag ref.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-relay

concurrency:
  group: docker-relay-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Guard the manual path: dispatched from a branch instead of a tag, every tag pattern below
    # evaluates empty and `build-push-action` would fail on an empty tag list with push: true.
    # Skip cleanly instead.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Semver only. The dev `main` / `main-<N>` tags belong to docker-relay.yaml; keeping the
          # sets disjoint is what makes ":X.Y.Z on the relay" mean the same thing it means on the
          # app image — a cut release, not a main-branch build.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=YourPHR relay
            org.opencontainers.image.description=YourPHR SMART on FHIR OAuth store-and-poll relay — public bouncer for the short-lived authorization code; never sees tokens.
            org.opencontainers.image.source=https://github.com/jwilleke/yourphr
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

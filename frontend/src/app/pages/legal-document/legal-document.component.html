<div class="az-content-body">
  <div class="mg-b-20">
    <h4 class="mg-b-5"><i class="fas fa-file-contract"></i>&nbsp; {{ title }}</h4>
    <p class="tx-gray-500 mg-b-0" *ngIf="document">
      <ng-container *ngIf="document.source === 'operator'">
        Published by the operator of this instance.
      </ng-container>
      <ng-container *ngIf="document.source === 'shipped'">
        The standard YourPHR document, as shipped with this release. The operator of this instance
        has not published their own.
      </ng-container>
    </p>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <p class="tx-gray-500" *ngIf="loading">Loading…</p>

  <!-- Bound with [innerHTML] deliberately: Angular sanitizes it, so an operator's Markdown
       renders while any script it contains is stripped. -->
  <div class="legal-body" *ngIf="document" [innerHTML]="document.html"></div>

  <hr *ngIf="document">
  <p class="tx-gray-500 tx-12 mg-b-0" *ngIf="document">
    Document version <code>{{ document.digest }}</code> ·
    <a routerLink="/contact">Contact</a> ·
    <a routerLink="/privacy">Privacy</a> ·
    <a routerLink="/terms">Terms</a>
  </p>
</div>

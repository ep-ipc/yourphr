<!-- Nothing to interact with: this route signs the visitor in and redirects. The spinner exists so a
     slow instance does not look like a blank page (#517). -->
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-3 mb-0 tx-14 tx-gray-600">
    {{ asAdmin ? "Opening the demo's admin tour..." : "Opening the demo..." }}
  </p>
</div>

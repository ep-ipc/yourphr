<div class="az-footer ht-40 page-footer fixed-bottom">
  <div class="container ht-100p pd-t-0-f">
    <div class="d-sm-flex justify-content-center justify-content-sm-between py-2 w-100">
      <span class="text-muted text-center text-sm-start d-block d-sm-inline-block">Copyright © YourPHR {{currentYear}} | {{appVersion}}
        · <a routerLink="/attributions">Attributions</a>
        · <a href="https://yourphr.org/privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
        <!-- Operator of THIS instance (#454). Rendered only when set — no placeholder, no fallback. -->
        <ng-container *ngIf="hasOperatorContact">
          · <span class="text-nowrap">Operated by<span *ngIf="operatorName">&nbsp;{{operatorName}}</span></span>
          <a *ngIf="operatorContactEmail" [href]="'mailto:' + operatorContactEmail">&nbsp;{{operatorContactEmail}}</a>
          <a *ngIf="operatorContactUrl" [href]="operatorContactUrl" target="_blank" rel="noopener noreferrer">&nbsp;Support</a>
        </ng-container>
      </span>
      <span class="float-none float-sm-right d-block mt-1 mt-sm-0 text-center"><a href="https://yourphr.org" externalLink>Your medical records, immediately and in your hands — for free.</a></span>
    </div>
  </div><!-- container -->
</div><!-- az-footer -->

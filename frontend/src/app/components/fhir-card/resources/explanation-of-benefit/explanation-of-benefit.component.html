<div class="card card-fhir-resource">
  <div class="card-header" (click)="isCollapsed = !isCollapsed">
    <div>
      <h6 class="card-title">{{ heading }}</h6>
      <p class="card-text tx-gray-400" *ngIf="serviceDates"><strong>Service dates</strong> {{ serviceDates }}</p>
    </div>
    <fhir-ui-badge class="float-end" [status]="displayModel?.resourceStatus">{{ displayModel?.resourceStatus }}</fhir-ui-badge>
  </div>
  <div #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed" class="card-body">
    <!--
      Money first. A patient opening an explanation of benefits is asking "what do I owe?", and
      making them read past claim identifiers to find out is the wrong order (#262).
    -->
    <div *ngIf="amounts.length" class="mg-b-15">
      <div *ngFor="let amount of amounts" class="d-flex justify-content-between border-bottom pd-y-5">
        <span class="tx-gray-600">{{ amount.label }}</span>
        <strong>{{ amount.value }}</strong>
      </div>
    </div>

    <fhir-ui-table [displayModel]="displayModel" [tableData]="tableData"></fhir-ui-table>
  </div>
  <div *ngIf="showDetails" class="card-footer">
    <a class="float-end" [routerLink]="['/explore', displayModel?.source_id, 'resource', displayModel?.source_resource_id]">details</a>
  </div>
</div>

# What can be verified without patient data.
#
# Every other harness here (load, diff, writes, isolation, http) reads a real export and can only
# run on the operator's machine — CI must never see PHI. The SSRF work is deliberately different:
# it has no database and no records, so it runs on every push, which matters because it is the part
# of the transition with no library behind it and the part where being wrong is a vulnerability
# rather than a bug (yourphr#539).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # What the image ships (yourphr#587): tsc must EMIT, not just check.
      - name: Build (dist/ is what the image runs)
        run: npm run build

      # The guard is worth exactly as much as this boundary: anything that can import node:https or
      # call fetch() directly walks around it. See docs/planning/architecture-principles-typescript.md.
      - name: Network access confined to src/http
        run: npm run check:boundary
      - name: Store boundary — the driver lives in providers, nothing reaches past a manager (yourphr#609)
        run: npm run check:store
      - name: Framework skeleton (typed registry, boot order, guards)
        run: npm run framework
      - name: Unit tests with coverage floors on src/framework and src/app (yourphr#610)
        run: npm run test:coverage

      - name: SSRF guard
        run: npm run ssrf

      - name: SMART client
        run: npm run smart

      - name: Sync and resync
        run: npm run sync

      - name: No patient data in tracked files
        run: npm run check:phi

      # yourphr#540 — Phase 1: the read stack stays honest in CI. The corpus is GENERATED here,
      # fully synthetic and deterministic; committing an .ndjson would (rightly) trip the PHI guard.
      # Against a real snapshot these same harnesses stay manual and occasional — see README.
      - name: Generate synthetic corpus
        run: npx tsx scripts/make-synthetic-corpus.ts --out "$RUNNER_TEMP/corpus.ndjson"

      - name: Smoke (reference implementation holds the corpus)
        run: npx tsx scripts/smoke.ts --in "$RUNNER_TEMP/corpus.ndjson"

      - name: Differential (sqlite repository agrees with the reference)
        run: npx tsx scripts/diff-repositories.ts --in "$RUNNER_TEMP/corpus.ndjson" --db "$RUNNER_TEMP/diff.db"

      - name: Write path (create, update, delete, reindex)
        run: npx tsx scripts/write-tests.ts --in "$RUNNER_TEMP/corpus.ndjson" --db "$RUNNER_TEMP/writes.db"

      - name: Auth (sessions, revocation, throttling, the wire)
        run: npm run auth

      - name: Configuration system (precedence, overlay, refusals)
        run: npm run config

      - name: Bootstrap environment (.env precedence)
        run: npm run env

      - name: Encrypted backup (ciphertext, roundtrip, refusals)
        run: npm run backup

      - name: Provider catalog + sync worker (secrets, seeding, refresh, isolation)
        run: npm run worker

      - name: Migrations (run-once, rollback, downgrade protection)
        run: npm run migrations

      - name: IPS composition + narratives (required sections, legibility, determinism)
        run: npm run ips

      - name: Provenance (source attribution, re-confirmation, honesty)
        run: npm run provenance

      - name: Medication reconciliation (dedup, state honesty, conflicts surfaced)
        run: npm run medication
      - name: Record pages (conditions, allergies, immunizations, recent, favourites, the typed query)
        run: npm run records

      - name: Dynamic Client Registration (endpoint gauntlet, refusals, persistence)
        run: npm run dcr

      - name: The assembly (boot -> sign-in -> record read, every module engaged)
        run: npm run app

      - name: Source + token migration (Go reader, one-way import, refresh without reconnect)
        run: npm run migrate

      - name: Frontend serving (SPA fallback, traversal containment, API precedence)
        run: npm run web

      - name: One-command migration (users, catalog, sources, records, config; verification gate with teeth)
        run: npm run migrate:tool

      - name: The process (boot from environment, /healthz, static, refusals, clean shutdown)
        run: npm run process

  # E2E (yourphr#610): Playwright drives the BUILT Angular app — the bundle the image serves, pulled
  # from the product image rather than rebuilt here — against a booted spike with synthetic data.
  e2e:
    name: E2E (Playwright over the built Angular app)
    runs-on: ubuntu-latest
    env:
      FRONTEND_IMAGE: ghcr.io/jwilleke/yourphr:2.10.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Extract the built Angular app from the product image
        run: |
          id=$(docker create "$FRONTEND_IMAGE")
          docker cp "$id:/opt/fasten/web" "$RUNNER_TEMP/web"
          docker rm "$id" >/dev/null
          test -f "$RUNNER_TEMP/web/index.html"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Journeys
        run: npm run e2e
        env:
          SPIKE_E2E_WEB_DIR: ${{ runner.temp }}/web
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 3
